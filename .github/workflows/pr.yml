name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and build
    runs-on: ubuntu-latest
    env:
      # Dummy values so it will build without errors
      BETTER_AUTH_DISCORD_CLIENT_ID: test
      BETTER_AUTH_DISCORD_CLIENT_SECRET: test
      BETTER_AUTH_SECRET: test-123e4567-e89b-12d3-a456-426614174000
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://test:test@test:5432/test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Build application
        run: pnpm build
